spring.application.name=bff

core.authentication.service.url=https://localhost/Authservice
core.main.service.url=https://localhost/Mainservice
core.my.service.url=https://localhost/BFF

jwt.rsa-public-key=file:config/certs/PublicKey.pem

server.port=8089

#logger.type
logging.framework=slf4j

spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=false

# Cookie configuration
app.cookie.max-age=86400
app.cookie.path=/

# For development, set these values:
app.cookie.same-site=Lax
app.environment=dev

# For production, set these values:
# app.environment=prod
# app.cookie.same-site=Strict

# Fingerprint verification configuration
fingerprint.verification.enabled=false
app.fingerprint.verification.excluded-paths=/BFF/api/proxy/AuthForward/**,/BFF/api/proxy/Main/**,/BFF/api/health,/BFF/api/proxy,/vx/gateway/**,/vx/flutter

# Authentication mode: 'cookie' for web browsers, 'token' for mobile apps, 'hybrid' for both
# In hybrid mode, tokens are returned in response body AND set as cookies
app.auth.mode=hybrid

#spring.web.resources.static-locations=classpath:/static/

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# WebSocket Backend URLs
# Flutter WebSocket proxy - connects to WebSocket Service's Flutter endpoint
websocket.backend.url=ws://localhost:8082/vx/flutter

# Gateway WebSocket proxy - connects to WebSocket Service's OrangePi gateway endpoint
websocket.backend.gateway.url=ws://localhost:8082/vx/gateway

# Device Discovery WebSocket proxy - connects to WebSocket Service's device discovery endpoint
websocket.backend.deviceDiscovery.url=ws://localhost:8082/vx/gateway/deviceDiscovery

# Device Assignment WebSocket proxy - connects to WebSocket Service's device assignment endpoint
websocket.backend.deviceAssignment.url=ws://localhost:8082/vx/device-assignment